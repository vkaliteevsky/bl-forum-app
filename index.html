<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Blockchain Life · Networking — clickable prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#070D2E; --scr:#0A1140; --panel:#0E1745; --panel2:#121C50; --line:#1B2560;
 --blue:#2F6BFF; --blue2:#1E3A8A; --cyan:#00D1FF; --gold:#FFD60A; --green:#22C55E; --pink:#FF3B7A;
 --text:#FFF; --muted:#93A0C9; --dim:#5B6795;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
 font-family:'Space Grotesk','Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);
 display:flex;align-items:center;justify-content:center;min-height:100vh;
 -webkit-font-smoothing:antialiased;overflow:hidden;
}
.caption{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.phone{
 width:375px;height:812px;max-height:96vh;aspect-ratio:375/812;
 background:#0A1140;border:1px solid #26326E;border-radius:48px;padding:10px;
 box-shadow:0 40px 100px rgba(0,0,0,.6);position:relative;flex:none;transform-origin:center;
}
@media(max-height:860px){.phone{transform:scale(calc(96vh/832))}}
@media(max-width:430px){
 body{align-items:stretch}
 .phone{width:100vw;height:100vh;max-height:none;border:none;border-radius:0;padding:0;transform:none;box-shadow:none}
 .screen{border-radius:0}
 .caption{display:none}
}
.screen{width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--scr);display:flex;flex-direction:column;position:relative}
.statusbar{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:2px 24px 0;font-size:13px;font-weight:700}
.statusbar .r{font-size:10px;letter-spacing:1.5px}
#view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.pagetitle{font-size:20px;font-weight:700;letter-spacing:-.02em;padding:6px 16px 12px;flex:none}
.ph1{font-size:20px;font-weight:700;letter-spacing:-.02em;padding:6px 16px 0;flex:none}
.ph2{font-size:9.5px;color:var(--cyan);letter-spacing:.2em;text-transform:uppercase;font-weight:700;padding:3px 16px 12px;flex:none}

.tabbar{height:64px;flex:none;background:#0D1548;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:0 14px}
.tab{position:relative;padding:8px;cursor:pointer;border:none;background:none}
.tab svg{width:23px;height:23px;stroke:#3D63D8;fill:none;stroke-width:1.8;display:block;stroke-linecap:round;stroke-linejoin:round}
.tab.on svg{stroke:var(--blue)}
.tab .bdg{position:absolute;top:6px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--pink);border:2px solid #0D1548}

/* picker */
.picker{flex:1;display:flex;flex-direction:column;padding:22px 22px 30px;overflow:auto}
.picker .kick{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
.picker h1{font-size:26px;font-weight:800;line-height:1.15;margin-bottom:8px}
.picker .sub{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:22px}
.rolebtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:12px;cursor:pointer;color:var(--text);font-family:inherit}
.rolebtn:active{background:var(--panel2)}
.rolebtn .ric{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center}
.rolebtn .ric svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.rolebtn b{display:block;font-size:15px;font-weight:800}
.rolebtn small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.picker .note{margin-top:auto;font-size:10.5px;color:var(--dim);line-height:1.5;padding-top:16px}

/* avatars with photo + fallback */
.pav{position:relative;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.pav img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
.pav.logo{background:#fff !important}
.pav.logo img{object-fit:contain;padding:18%}

/* feed */
.feedwrap{flex:1;position:relative;padding:6px 14px 14px;min-height:0}
.stack{position:absolute;top:6px;right:14px;bottom:14px;left:14px}
.fcard{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;touch-action:none;user-select:none;background:#0B1746;will-change:transform}
.fcard.under{transform:scale(.96) translateY(10px);filter:brightness(.75)}
.fcard .photo,.hero .photo{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(180deg,#13234E,#081137)}
.fcard .photo img,.hero .photo img{width:100%;height:100%;object-fit:cover;opacity:.55}
.fcard .shade,.hero .shade{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(180deg,rgba(6,10,38,.15) 0%,transparent 26%,transparent 40%,rgba(6,10,38,.9) 70%,rgba(6,10,38,.98) 100%)}
.ava-big{position:absolute;top:24%;left:50%;transform:translate(-50%,-50%);width:156px;height:156px;border-radius:50%;font-size:50px;border:3px solid rgba(255,255,255,.35)}
.ava-big.sq{border-radius:28px}
.fcard .top,.hero .top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:10px;padding:6px 10px}
.chip.ghost{background:rgba(10,16,50,.55);color:#C9D2F2;backdrop-filter:blur(4px)}
.chip.linkc{background:#2BE080;color:#05250F;font-size:10.5px;border-radius:7px;padding:5px 9px}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.rolelb{font-size:10px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:#CFE0FF;padding-top:3px}
.fcard .info,.hero .info{position:relative;z-index:2;margin-top:auto;padding:0 18px 16px}
.fcard .name,.hero .name{font-size:31px;font-weight:700;line-height:.98;letter-spacing:-.03em}
.fcard .loc,.hero .loc{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#9FB0DC;margin:9px 0 7px;font-weight:600}
.fcard .bio,.hero .bio{font-size:12.5px;line-height:1.55;color:#C7CFEE;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.tag-b{background:var(--blue);border-radius:8px;font-size:11px;font-weight:700;padding:5px 9px}
.tagsA{font-size:12.5px;color:var(--cyan);font-weight:700;margin-top:9px;letter-spacing:.01em}
.factions{display:flex;gap:9px;margin-top:15px}
.bbar{flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;border:none}
.bbar.skipb{background:rgba(7,13,46,.4);border:1.5px solid #33427E;color:var(--muted)}
.bbar.connb{background:var(--blue);color:#fff}
.stamp{position:absolute;top:56px;font-size:26px;font-weight:800;letter-spacing:.08em;padding:8px 16px;border:3px solid;border-radius:12px;z-index:3;opacity:0;transform:rotate(-12deg)}
.stamp.like{right:22px;color:var(--green);border-color:var(--green);transform:rotate(10deg)}
.stamp.nope{left:22px;color:var(--pink);border-color:var(--pink)}
.fempty{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:0 40px}
.fempty .big{font-size:40px}
.fempty b{color:var(--text)}
.linkbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 18px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}

/* sponsor themes */
.spcard .photo.goldgrad{background:
 linear-gradient(115deg,transparent 32%,rgba(255,255,255,.32) 45%,transparent 58%),
 radial-gradient(120% 90% at 82% 8%,#FFF3C4 0%,transparent 45%),
 radial-gradient(100% 80% at 8% 96%,#7A4A03 0%,transparent 55%),
 linear-gradient(160deg,#FFDf7E 0%,#F2B93B 32%,#D89A18 55%,#A66E08 78%,#6E4503 100%)}
.spcard .photo.diamond{background:
 linear-gradient(115deg,transparent 32%,rgba(255,255,255,.4) 45%,transparent 58%),
 radial-gradient(120% 90% at 82% 8%,#EAF6FF 0%,transparent 45%),
 radial-gradient(100% 80% at 8% 96%,#101B4B 0%,transparent 55%),
 linear-gradient(160deg,#BFE0FF 0%,#7FB8FF 30%,#3D63D8 60%,#1B2A6B 100%)}
.spcard .photo.platinum{background:
 linear-gradient(115deg,transparent 32%,rgba(255,255,255,.4) 45%,transparent 58%),
 radial-gradient(120% 90% at 82% 8%,#F2F6FC 0%,transparent 45%),
 radial-gradient(100% 80% at 8% 96%,#1C2333 0%,transparent 55%),
 linear-gradient(160deg,#DDE6F2 0%,#9FB0C8 32%,#5A6B85 62%,#232B3E 100%)}
.spcard .photo.silverg{background:
 linear-gradient(115deg,transparent 32%,rgba(255,255,255,.3) 45%,transparent 58%),
 radial-gradient(120% 90% at 82% 8%,#EDEFF3 0%,transparent 45%),
 radial-gradient(100% 80% at 8% 96%,#23272E 0%,transparent 55%),
 linear-gradient(160deg,#C9CFD9 0%,#9AA2AE 35%,#5F6773 65%,#2A2F38 100%)}
.spcard .photo.orange{background:radial-gradient(120% 90% at 80% 10%,#FFB35C 0%,transparent 55%),radial-gradient(120% 90% at 10% 90%,#E2540A 0%,transparent 60%),linear-gradient(160deg,#F58A2E 0%,#E9660E 45%,#C74A05 100%)}
.spcard .photo.blue{background:radial-gradient(120% 90% at 80% 10%,#4D7DFF 0%,transparent 55%),radial-gradient(120% 90% at 10% 90%,#12245F 0%,transparent 60%),linear-gradient(160deg,#2F54EB 0%,#1E3A8A 60%,#101B4B 100%)}
.spcard .photo.navy{background:radial-gradient(120% 90% at 80% 10%,#3D63D8 0%,transparent 50%),linear-gradient(160deg,#1B2A6B 0%,#101B4B 55%,#0A1030 100%)}
.spcard .photo.teal{background:radial-gradient(120% 90% at 80% 10%,#2BE0C8 0%,transparent 55%),radial-gradient(120% 90% at 10% 90%,#0A5E57 0%,transparent 60%),linear-gradient(160deg,#0FB5AE 0%,#0A7E78 55%,#093B4F 100%)}
.spcard .photo.violet{background:radial-gradient(120% 90% at 80% 10%,#B98CFF 0%,transparent 55%),radial-gradient(120% 90% at 10% 90%,#3A1D7A 0%,transparent 60%),linear-gradient(160deg,#7A5CFF 0%,#5B3BD6 55%,#2A1660 100%)}
.spcard .photo.green{background:radial-gradient(120% 90% at 80% 10%,#5FE39A 0%,transparent 55%),linear-gradient(160deg,#1E9E5C 0%,#136A46 55%,#0B3A2C 100%)}
.spcard .photo.goldth{background:radial-gradient(120% 90% at 80% 10%,#FFE28A 0%,transparent 55%),linear-gradient(160deg,#D9A410 0%,#A97B08 55%,#5F4404 100%)}
.spcard .photo.red{background:radial-gradient(120% 90% at 80% 10%,#FF8AA6 0%,transparent 55%),linear-gradient(160deg,#E23A5E 0%,#B01F42 55%,#5C0F24 100%)}
.sp-chipw{position:absolute;top:14px;left:14px;display:flex;gap:9px;align-items:center;background:#fff;border-radius:12px;padding:8px 13px 8px 8px;z-index:2}
.sp-chipw .logo{width:34px;height:34px;border-radius:9px;flex:none;font-size:13px}
.sp-chipw .n{font-size:12.5px;font-weight:800;color:#101010;line-height:1.25}
.sp-chipw .s{font-size:10px;font-weight:800;letter-spacing:.03em}
.sp-chipw .s.gold{color:#B8860B}.sp-chipw .s.dia{color:#3D63D8}.sp-chipw .s.plat{color:#5A6B85}.sp-chipw .s.silv{color:#6E7683}
.sp-x{position:absolute;top:16px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(10,14,40,.35);display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer;border:none;backdrop-filter:blur(3px)}
.sp-x svg{width:15px;height:15px;stroke:#fff;stroke-width:2.4;fill:none}
.glass{margin:auto 20px;background:rgba(255,255,255,.72);backdrop-filter:blur(6px);border-radius:18px;padding:24px 16px;text-align:center;border:1px solid rgba(255,255,255,.8);position:relative;z-index:2}
.glass .wm{font-size:26px;font-weight:800;color:#161616}
.glass .tg{font-size:11px;font-weight:600;color:#3A3A3A;margin-top:7px;line-height:1.45}
.sp-cta{margin:0 20px 20px;height:50px;border-radius:14px;background:#0C1445;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;position:relative;z-index:2;cursor:pointer;border:none;font-family:inherit;width:calc(100% - 40px)}

/* detail */
.detail{flex:1;overflow:auto;padding:0 14px 20px}
.detail .hero{border-radius:20px;overflow:hidden;position:relative;height:430px;display:flex;flex-direction:column;flex:none}
.backbtn{position:absolute;top:14px;left:14px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(10,16,50,.6);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.backbtn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2}
.sect{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.sect h4{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:9px}
.sect p{font-size:12.5px;line-height:1.6;color:var(--muted)}
.sect .row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);padding:6px 0}
.sect .row svg{width:16px;height:16px;stroke:var(--blue);fill:none;stroke-width:2;flex:none}
.dactions{display:flex;gap:10px;margin-top:14px}
.dprim{flex:1.4;height:50px;border-radius:14px;background:var(--blue);color:#fff;font-size:15px;font-weight:800;border:none;font-family:inherit;cursor:pointer}
.dskip{flex:1;height:50px;border-radius:14px;background:none;border:1.5px solid #33427E;color:var(--muted);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.mrow{display:flex;align-items:center;gap:11px;padding:11px 4px;border-top:1px solid #17215A;cursor:pointer}
.mrow:first-of-type{border-top:none}
.mrow .mic{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex:none}
.mrow .mic svg{width:17px;height:17px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mrow .ml{flex:1;font-size:13px;font-weight:700;color:#CFE0FF;text-decoration:underline;text-decoration-color:#33427E;text-underline-offset:3px}
.mrow .mx{flex:none}
.mrow .mx svg{width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round}

/* list rows (chats / incoming / outgoing) */
.connwrap{flex:1;overflow:auto;padding-bottom:8px}
.stories{display:flex;gap:11px;padding:2px 16px 16px;overflow-x:auto}
.story{width:64px;flex:none;text-align:center;cursor:pointer}
.story .av{width:60px;height:60px;border-radius:50%;font-size:19px;position:relative;margin:0 auto}
.story .on2::after{content:"";position:absolute;right:2px;bottom:2px;width:12px;height:12px;border-radius:4px;background:var(--green);border:2.5px solid var(--scr);z-index:2}
.story small{display:block;font-size:9.5px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem{position:relative;overflow:hidden;border-top:1px solid #121B52}
.crow{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--scr);position:relative;z-index:2;transition:transform .18s;cursor:pointer;touch-action:pan-y}
.crow .av{width:56px;height:56px;border-radius:50%;font-size:17px}
.crow .avwrap{position:relative;flex:none}
.crow .dot{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:4px;background:var(--green);border:2.5px solid var(--scr);z-index:2}
.crow .t{min-width:0;flex:1}
.crow .n{font-size:15px;font-weight:800}
.crow .m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.crow .m.unread{color:#DDE4FA;font-weight:700}
.crow .meta{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.crow .tm{font-size:9px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.crow .ub{width:9px;height:9px;border-radius:50%;background:var(--blue)}
.pill{font-size:9.5px;font-weight:800;border-radius:8px;padding:4px 8px;letter-spacing:.03em;white-space:nowrap}
.pill.sent{background:#3A2A0E;color:#FFC554;border:1px solid #6B4E14}
.pill.noreply{background:#14264F;color:#7FA7FF;border:1px solid #24407E}
.accbtn{height:34px;padding:0 15px;border-radius:10px;background:var(--blue);border:none;color:#fff;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;flex:none}
.cacts{position:absolute;top:0;right:0;bottom:0;display:flex;z-index:1}
.cact{width:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10.5px;font-weight:800;border:none;color:#fff;cursor:pointer;font-family:inherit}
.cact svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.cact.un{background:#141E56}.cact.met{background:var(--blue)}
.hiddenrow{display:flex;justify-content:space-between;align-items:center;padding:16px;color:var(--muted);font-size:14px;font-weight:800;border-top:1px solid #121B52;cursor:pointer}
.hiddenrow svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.emptylist{padding:60px 40px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}

/* chat */
.chathead{display:flex;align-items:center;gap:11px;padding:4px 14px 12px;border-bottom:1px solid var(--line);flex:none}
.chathead .av{width:40px;height:40px;border-radius:50%;font-size:13px}
.chathead .n{font-size:14.5px;font-weight:800}
.chathead .st{font-size:10.5px;color:var(--green);margin-top:1px}
.chathead .back{background:none;border:none;cursor:pointer;padding:4px}
.chathead .back svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:76%;padding:10px 13px;border-radius:16px;font-size:13px;line-height:1.45}
.msg.them{background:var(--panel2);align-self:flex-start;border-bottom-left-radius:5px}
.msg.me{background:var(--blue);align-self:flex-end;border-bottom-right-radius:5px}
.typing{align-self:flex-start;color:var(--dim);font-size:11px;padding-left:4px}
.composer{display:flex;gap:9px;padding:10px 14px 14px;flex:none;border-top:1px solid var(--line)}
.composer input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:22px;height:44px;padding:0 16px;color:#fff;font-family:inherit;font-size:13.5px;outline:none}
.composer button{width:44px;height:44px;border-radius:50%;background:var(--blue);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.composer button svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.2}

/* analytics */
.anwrap{flex:1;overflow:auto;padding:0 16px 16px}
.periods{display:flex;gap:8px;padding-bottom:18px}
.per{font-size:11.5px;font-weight:700;border-radius:16px;padding:7px 13px;background:#141E56;color:var(--muted);border:none;font-family:inherit;cursor:pointer}
.per.on{background:var(--blue);color:#fff}
.km{font-size:15px;font-weight:800}
.km-sub{font-size:11.5px;color:var(--muted);margin:3px 0 14px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{background:var(--panel2);border-radius:14px;padding:13px 14px}
.mcard .l{font-size:11px;color:#C4CCEB;font-weight:600}
.mcard .v{font-size:22px;font-weight:800;margin:4px 0 7px}
.mcard .d{font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:4px}
.mcard .d.neg{color:var(--pink)}.mcard .d.pos{color:var(--green)}
.mcard .d svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}

/* my profile */
.mywrap{flex:1;overflow:auto;padding:0 16px 16px}
.mycard{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.mycard .av{width:64px;height:64px;border-radius:50%;font-size:21px}
.mycard .n{font-size:17px;font-weight:800}

/* ==== FEED ORDER ==== */
function buildFeed(){
 const meId = (PERSONAS[S.role]||{}).pid;
 const ids=PROFILES.filter(p=>!p.feedHide && p.id!==meId).map(p=>p.id);
 const inv=ids.filter(i=>pById(i).role==="inv"), sup=ids.filter(i=>pById(i).role==="sup"),
       look=ids.filter(i=>pById(i).role==="look"), co=ids.filter(i=>pById(i).role==="co");
 let order=[];
 const src = S.role==="inv" ? [sup,co,look,inv] : S.role==="sup" ? [inv,co,sup,look] : [co,sup,inv,look];
 const max=Math.max(...src.map(a=>a.length));
 for(let i=0;i<max;i++) src.forEach(a=>{ if(a[i]) order.push({type:"p",id:a[i]}); });
 /* взвешенная ротация спонсоров: вес по уровню */
 const W={Diamond:4,Platinum:3,Gold:2,Silver:1};
 const slots=[];
 SPONSOR_CARDS.forEach(s=>{
   const w=W[Object.keys(W).find(k=>s.tier.startsWith(k))||"Gold"];
   for(let k=1;k<=w;k++) slots.push({id:s.id,pos:k/w});
 });
 slots.sort((a,b)=>a.pos-b.pos);
 const rotation=slots.map(x=>x.id);
 let out=[], si=0;
 order.forEach((o,i)=>{ out.push(o); if((i+1)%4===0){out.push({type:"s",id:rotation[si%rotation.length]}); si++;} });
 const seen=new Set(out.filter(o=>o.type==="s").map(o=>o.id));
 SPONSOR_CARDS.forEach(s=>{ if(!seen.has(s.id)) out.push({type:"s",id:s.id}); });
 S.feedOrder=out; S.feedIdx=0;
}

/* ==== RENDER ROOT ==== */
function render(){
 const v=document.getElementById("view"), tb=document.getElementById("tabs");
 if(S.screen==="picker"){ v.innerHTML=rPicker(); tb.innerHTML=""; bindPicker(); return; }
 v.innerHTML = ({feed:rFeed, incoming:rIncoming, outgoing:rOutgoing, connections:rConnections, chat:rChat,
                 analytics:rAnalytics, me:rMe, detail:rDetail})[S.screen]();
 tb.innerHTML = rTabs();
 bindCommon();
 const _b=({feed:bindFeed, incoming:bindIncoming, outgoing:bindOutgoing, connections:bindConnections, chat:bindChat,
   analytics:bindAnalytics, me:bindMe, detail:bindDetail})[S.screen]; if(_b) _b();
}

/* ==== TABS ==== */
function unreadTotal(){ return S.chats.reduce((s,c)=>s+c.unread,0); }
function rTabs(){
 const spon=S.role==="spon";
 const tabs = spon
  ? [["feed","cards"],["analytics","bars"],["connections","chat"],["incoming","inbox"],["me","user"]]
  : [["feed","cards"],["connections","chat"],["incoming","inbox"],["outgoing","outbox"],["me","user"]];
 return `<div class="tabbar">`+tabs.map(([id,ic])=>{
   const on=(S.screen===id)||(S.screen==="chat"&&id==="connections")||(S.screen==="detail"&&id===({feed:"feed",incoming:"incoming",outgoing:"outgoing",connections:"connections"}[S.detailBack]||"feed"));
   let bdg="";
   if(id==="connections"&&unreadTotal()) bdg=`<span class="bdg"></span>`;
   if(id==="incoming"&&S.incoming.length) bdg=`<span class="bdg"></span>`;
   return `<button class="tab ${on?"on":""}" data-tab="${id}">${svg(ic)}${bdg}</button>`;
 }).join("")+`</div>`;
}
function bindCommon(){
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ S.screen=b.dataset.tab; render(); });
}

 </div>`;
}

function rProfileCard(p, full=false){

 const roleTxt=p.role==="co"?"Company":roleLabel(p.role);
 return `
  <div class="photo"><img src="${coverUrl(p)}" alt="" loading="lazy" onerror="this.remove()"></div>
  ${avatar(p,"ava-big"+(p.role==="co"?" sq":""))}
  <div class="shade"></div>
  <div class="top">
    <span class="rolelb">${roleTxt.split("").join("\u2009")}</span>
    ${p.link?`<span class="chip linkc">${p.link}</span>`:""}
  </div>
  <div class="info">
    <div class="name">${p.name}</div>
    <div class="loc">${p.city}</div>
    <div class="bio" ${full?'style="-webkit-line-clamp:unset"':""}>${p.bio}</div>
    <div class="tagsA">${p.tags.map(x=>"#"+x).join("&nbsp;&nbsp;")}</div>
    ${full?"":`<div class="factions">
      <button class="bbar skipb" data-act="nope">${t("skip")}</button>
      <button class="bbar connb" data-act="like">${t("connect")}</button>
    </div>`}
  </div>
  ${full?"":`<div class="stamp like">CONNECT</div><div class="stamp nope">SKIP</div>`}`;
}
function rSponsorFeed(s){
 const TIER={Diamond:{bg:"diamond",cls:"dia",chip:"linear-gradient(135deg,#3D63D8,#7A5CFF)"},
             Platinum:{bg:"platinum",cls:"plat",chip:"linear-gradient(135deg,#9FB0C8,#5A6B85)"},
             Gold:{bg:"goldgrad",cls:"gold",chip:"linear-gradient(135deg,#F2B93B,#A66E08)"},
             Silver:{bg:"silverg",cls:"silv",chip:"linear-gradient(135deg,#A8B0BC,#5F6773)"}};
 const tk=Object.keys(TIER).find(k=>s.tier.startsWith(k))||"Gold", T=TIER[tk];
 const logo=s.domain?`<img src="https://www.google.com/s2/favicons?domain=${s.domain}&sz=128" alt="" style="width:100%;height:100%;object-fit:contain;padding:12%" onerror="this.remove()">`:"";
 return `
  <div class="photo ${T.bg}"></div>
  <div class="sp-chipw">
    <span class="logo pav" style="background:${T.chip};border-radius:9px">${logo||initials(s.name)}</span>
    <span><span class="n">${s.name}</span><br><span class="s ${T.cls}">${s.tier.toUpperCase()}</span></span>
  </div>
  <button class="sp-x" data-act="spclose">${svg("x")}</button>
  <div class="glass"><div class="wm">${s.name}</div><div class="tg">${s.tagline}</div></div>
  <button class="sp-cta" data-act="spcta">${s.ctaText}</button>`;
}
function currentFeedItems(){
 const items=[];
 for(let i=S.feedIdx;i<S.feedOrder.length && items.length<2;i++){
   const o=S.feedOrder[i];
   if(o.type==="s"&&S.dismissedSponsors.has(o.id)) continue;
   items.push(o);
 }
 return items;
}
function rFeed(){
 const items=currentFeedItems();
 if(!items.length){
   return `<div class="feedwrap"><div class="fempty">
     <div class="big">🤝</div><b>${t("feed_end")}</b><span style="font-size:12.5px">${t("feed_end_sub")}</span>
     <button class="linkbtn" data-act="restart">${t("restart")}</button></div></div>`;
 }
 return `<div class="feedwrap"><div class="stack">`+
   items.slice().reverse().map((o,ri)=>{
     const topmost = ri===items.length-1;
     const inner = o.type==="s" ? rSponsorFeed(SPONSOR_CARDS.find(x=>x.id===o.id)) : rProfileCard(pById(o.id));
     return `<div class="fcard ${o.type==="s"?"spcard":""} ${topmost?"topmost":"under"}" data-id="${o.id}" data-type="${o.type}">${inner}</div>`;
   }).join("")+`</div></div>`;
}
function advanceFeed(){
 do{ S.feedIdx++; } while(S.feedOrder[S.feedIdx] && S.feedOrder[S.feedIdx].type==="s" && S.dismissedSponsors.has(S.feedOrder[S.feedIdx].id));
 const stack=document.querySelector(".stack");
 const items=currentFeedItems();
 if(!stack || !items.length){ render(); return; }
 const top=stack.querySelector(".fcard.topmost");
 if(top) top.remove();
 const under=stack.querySelector(".fcard.under");
 if(!under){ render(); return; }
 /* нижняя карточка плавно доезжает до полного размера, картинки в ней уже загружены */
 under.style.transition="transform .22s ease-out, filter .22s ease-out";
 under.classList.remove("under");
 under.classList.add("topmost");
 setTimeout(()=>{ under.style.transition=""; },240);
 /* подкладываю следующую карточку вниз стопки */
 if(items[1]){
   const o=items[1];
   const div=document.createElement("div");
   div.className="fcard "+(o.type==="s"?"spcard ":"")+"under";
   div.dataset.id=o.id; div.dataset.type=o.type;
   div.innerHTML = o.type==="s" ? rSponsorFeed(SPONSOR_CARDS.find(x=>x.id===o.id)) : rProfileCard(pById(o.id));
   stack.insertBefore(div, stack.firstChild);
 }
 bindFeed();
 document.getElementById("tabs").innerHTML=rTabs();
 bindCommon();
}
function flyOut(card, dir, cb){
 card.style.transition="transform .32s ease-in, opacity .32s";
 card.style.transform=`translateX(${dir*560}px) rotate(${dir*22}deg)`;
 card.style.opacity="0";
 setTimeout(cb,300);
}
/* direction always follows the action: like → right, skip → left */
function onDecision(like){
 const card=document.querySelector(".fcard.topmost");
 if(!card) return;
 const o=S.feedOrder[S.feedIdx];
 flyOut(card, like?1:-1, ()=>{
   if(like && o.type==="p"){
     if(!S.outgoing.some(r=>r.pid===o.id))
       S.outgoing.unshift({pid:o.id, text:OUT_TEXT[S.role]||OUT_TEXT.look, status:"sent"});
     toast(t("connected"));
   }
   advanceFeed();
 });
}
function bindFeed(){
 const _rs=document.querySelector('[data-act="restart"]'); if(_rs) _rs.addEventListener("click",()=>{ buildFeed(); S.dismissedSponsors.clear(); render(); });
 const card=document.querySelector(".fcard.topmost");
 if(!card) return;
 const _n=card.querySelector('[data-act="nope"]'); if(_n) _n.addEventListener("click",e=>{e.stopPropagation();onDecision(false)});
 const _l=card.querySelector('[data-act="like"]'); if(_l) _l.addEventListener("click",e=>{e.stopPropagation();onDecision(true)});
 const _sc=card.querySelector('[data-act="spclose"]'); if(_sc) _sc.addEventListener("click",e=>{
   e.stopPropagation(); S.dismissedSponsors.add(card.dataset.id); advanceFeed();
 });
 const _sp=card.querySelector('[data-act="spcta"]'); if(_sp) _sp.addEventListener("click",e=>{
   e.stopPropagation();
   const s=SPONSOR_CARDS.find(x=>x.id===card.dataset.id);
   toast(t("sp_done"));
   S.dismissedSponsors.add(s.id); advanceFeed();
 });
 let moved=false;
 card.addEventListener("click",e=>{
   if(moved || e.target.closest("button")) return;
   if(card.dataset.type==="p"){ S.detailPid=card.dataset.id; S.detailBack="feed"; S.screen="detail"; render(); }
 });
 let sx=0, sy=0, dx=0, dragging=false;
 const like=card.querySelector(".stamp.like"), nope=card.querySelector(".stamp.nope");
 const move=e=>{
   if(!dragging) return;
   dx=e.clientX-sx; const dy=e.clientY-sy;
   if(Math.abs(dx)>6) moved=true;
   card.style.transform=`translate(${dx}px,${dy*.25}px) rotate(${dx*.05}deg)`;
   const op=Math.min(Math.abs(dx)/90,1);
   if(like&&nope){ like.style.opacity=dx>0?op:0; nope.style.opacity=dx<0?op:0; }
 };
 const cleanup=()=>{
   window.removeEventListener("pointermove",move);
   window.removeEventListener("pointerup",end);
   window.removeEventListener("pointercancel",end);
   window.removeEventListener("blur",end);
 };
 const end=()=>{
   if(!dragging) return; dragging=false; cleanup();
   if(Math.abs(dx)>110){
     const isLike=dx>0;
     if(card.dataset.type==="s"){ S.dismissedSponsors.add(card.dataset.id); flyOut(card,isLike?1:-1,advanceFeed); }
     else onDecision(isLike);
   }else{
     card.style.transition="transform .25s"; card.style.transform="";
     if(like&&nope){like.style.opacity=0;nope.style.opacity=0;}
   }
   dx=0;
 };
 card.addEventListener("pointerdown",e=>{
   if(e.target.closest("button")) return;
   dragging=true; moved=false; sx=e.clientX; sy=e.clientY;
   try{ card.setPointerCapture(e.pointerId); }catch(_){}
   card.style.transition="none";
   window.addEventListener("pointermove",move);
   window.addEventListener("pointerup",end);
   window.addEventListener("pointercancel",end);
   window.addEventListener("blur",end);
 });
 card.addEventListener("lostpointercapture",end);
}

function bindDetail(){

 document.querySelectorAll('[data-act="mat"]').forEach(b=>b.onclick=()=>toast(t("demo")));
 document.querySelector('[data-act="dskip"]').onclick=()=>{

 document.querySelector('[data-act="dconnect"]').onclick=()=>{

/* ==== CONNECTIONS ==== */
const TIMES=["12:40","11:05","Yesterday","Yesterday","Tue","Tue","Mon","Mon","Sun","Sat"];
function rConnections(){
 const stories=["marcus","liu","elena","jets"].map((id,i)=>{
   const p=pById(id);
   return `<div class="story" data-pid="${id}"><span class="av ${i%2?"":"on2"}" style="display:block">${avatar(p,"av")}</span><small>${p.name.split(" ")[0]}</small></div>`;
 }).join("");
 const rows=S.chats.map((c,i)=>{
   const p=pById(c.pid);
   const last=c.msgs[c.msgs.length-1];
   const preview=(last.f===0?t("you"):"")+last.t;
   return `<div class="citem" data-pid="${c.pid}">
     <div class="cacts">
       <button class="cact un" data-a="un">${svg("x")}${t("unmatch")}</button>
       <button class="cact met" data-a="met">${svg("met")}${t("wemet")}</button>
     </div>
     <div class="crow">
       <span class="avwrap">${avatar(p,"av")}${i<3?'<span class="dot"></span>':""}</span>
       <div class="t"><div class="n">${p.name}</div><div class="m ${c.unread?"unread":""}">${preview}</div></div>
       <div class="meta"><div class="tm">${TIMES[i%TIMES.length]}</div>${c.unread?`<div class="ub"></div>`:""}</div>
     </div>
   </div>`;
 }).join("");
 return `<div class="ph1">${t("connections")}</div><div class="ph2">${t("sub_unread").replace("{n}",unreadTotal())}</div>
  <div class="connwrap">
   <div class="stories">${stories}</div>
   ${rows}
   <div class="hiddenrow" data-act="hidden"><span>${t("hidden")} (${HIDDEN_COUNT})</span>${svg("chevD")}</div>
  </div>`;
}
function bindConnections(){
 document.querySelectorAll(".story").forEach(s=>s.onclick=()=>{ S.detailPid=s.dataset.pid; S.detailBack="connections"; S.screen="detail"; render(); });
 document.querySelector('[data-act="hidden"]').onclick=()=>toast(t("demo"));
 let openRow=null;
 document.querySelectorAll(".citem[data-pid]").forEach(item=>{
   const row=item.querySelector(".crow");
   let sx=0,dx=0,dragging=false,startOpen=false,moved=false;
   const move=e=>{
     if(!dragging)return;
     dx=e.clientX-sx; if(Math.abs(dx)>6)moved=true;
     let base=startOpen?-164:0;
     let x=Math.min(0,Math.max(-164,base+dx));
     row.style.transform=`translateX(${x}px)`;
   };
   const cleanup=()=>{
     window.removeEventListener("pointermove",move);
     window.removeEventListener("pointerup",end);
     window.removeEventListener("pointercancel",end);
     window.removeEventListener("blur",end);
   };
   const end=()=>{
     if(!dragging)return;dragging=false;cleanup();row.style.transition="";
     const base=startOpen?-164:0, x=base+dx;
     if(x<-82){ row.style.transform="translateX(-164px)"; if(openRow&&openRow!==item)openRow.querySelector(".crow").style.transform=""; openRow=item; }
     else{ row.style.transform=""; if(openRow===item)openRow=null; }
     dx=0;
   };
   row.addEventListener("pointerdown",e=>{
     if(e.target.closest("button")) return;
     dragging=true;moved=false;sx=e.clientX;startOpen=(openRow===item);
     try{ row.setPointerCapture(e.pointerId); }catch(_){}
     row.style.transition="none";
     window.addEventListener("pointermove",move);
     window.addEventListener("pointerup",end);
     window.addEventListener("pointercancel",end);
     window.addEventListener("blur",end);
   });
   row.addEventListener("lostpointercapture",end);
   row.addEventListener("click",()=>{
     if(moved)return;
     if(openRow===item){ row.style.transform=""; openRow=null; return; }
     const c=S.chats.find(x=>x.pid===item.dataset.pid); c.unread=0;
     S.chatId=item.dataset.pid; S.backTo="connections"; S.screen="chat"; render();
   });
   item.querySelector('[data-a="met"]').onclick=e=>{ e.stopPropagation(); row.style.transform=""; openRow=null; toast(t("meeting_rec")); };
   item.querySelector('[data-a="un"]').onclick=e=>{
     e.stopPropagation();
     S.chats=S.chats.filter(x=>x.pid!==item.dataset.pid);
     toast(t("removed")); render();
   };
 });
}

/* ==== CHAT ==== */
function rChat(){
 const c=S.chats.find(x=>x.pid===S.chatId), p=pById(S.chatId);
 return `
  <div class="chathead">
    <button class="back" data-act="back">${svg("back")}</button>
    ${avatar(p,"av")}
    <div><div class="n">${p.name}</div><div class="st">${t("online")}</div></div>
  </div>
  <div class="msgs" id="msgs">
    ${c.msgs.map(m=>`<div class="msg ${m.f?"them":"me"}">${m.t}</div>`).join("")}
  </div>
  <div class="composer">
    <input id="minput" placeholder="${t("msg_ph")}" autocomplete="off">
    <button id="msend">${svg("send")}</button>
  </div>`;
}
function bindChat(){
 const c=S.chats.find(x=>x.pid===S.chatId);
 const box=document.getElementById("msgs");
 box.scrollTop=box.scrollHeight;
 document.querySelector('[data-act="back"]').onclick=()=>{ S.screen="connections"; render(); };
 const input=document.getElementById("minput");
 const send=()=>{
   let txt=input.value.trim(); if(!txt)return;
   txt=txt.replace(/</g,"&lt;");
   c.msgs.push({f:0,t:txt}); input.value="";
   box.insertAdjacentHTML("beforeend",`<div class="msg me">${txt}</div>`);
   box.scrollTop=box.scrollHeight;
   if(c.autoReply&&c.autoReply.length){
     const reply=c.autoReply.shift();
     const tEl=document.createElement("div");tEl.className="typing";tEl.textContent="…";
     setTimeout(()=>{box.appendChild(tEl);box.scrollTop=box.scrollHeight;},500);
     setTimeout(()=>{
       tEl.remove(); c.msgs.push({f:1,t:reply});
       box.insertAdjacentHTML("beforeend",`<div class="msg them">${reply}</div>`);
       box.scrollTop=box.scrollHeight;
     },1600);
   }
 };
 document.getElementById("msend").onclick=send;
 input.addEventListener("keydown",e=>{if(e.key==="Enter")send();});
}
